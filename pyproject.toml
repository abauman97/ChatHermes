[project]
name = "chathermes-development"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "chathermes-dashboard-dependencies",
  "fastapi==0.133.1",
  "httpx==0.28.1",
  "pytest==9.0.2",
  "ruff>=0.17.3",
  "ty>=0.0.93",
  # Dependencies used by the pinned Hermes source contracts and Docker helpers.
  "python-dotenv",
  "PyYAML",
  "ruamel.yaml",
  "rich",
  "requests",
  "tomli-w",
  "websockets>=17.3",
]

[tool.uv]
package = false

[tool.uv.sources]
chathermes-dashboard-dependencies = { path = "plugin/chathermes" }

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".hermes-source", "tests/integration/native_runtime_probe.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100", "PGH004"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["plugin", ".hermes-source"]

[tool.ty.src]
include = ["plugin", "tests", "scripts"]
exclude = [".hermes-source"]

[tool.ty.rules]
# Keep every default correctness diagnostic enabled; promote warnings and
# opt-in checks for unsafe casts, overrides, and suppression hygiene.
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
invalid-ignore-comment = "error"
unused-ignore-comment = "error"
blanket-ignore-comment = "error"
missing-override-decorator = "error"
disjoint-cast = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*.test.py"]
# These probes require the isolated container and its copied plugin paths.
norecursedirs = ["integration"]
addopts = "--import-mode=importlib -ra"
